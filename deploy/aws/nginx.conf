# Installed in /etc/nginx/sites-available/classy-aws.
map $http_upgrade $classy_connection_upgrade {
    default upgrade;
    '' close;
}
log_format classy_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=classy_requests:10m rate=10r/s;

server {
    listen 80;
    server_name api.classystudy.com;
    return 301 https://api.classystudy.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.classystudy.com;
    ssl_certificate /etc/letsencrypt/live/api.classystudy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.classystudy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log /var/log/nginx/classy-access.log classy_no_query;
    error_log /var/log/nginx/classy-error.log;
    client_max_body_size 1g;
    client_body_timeout 300s;
    limit_req zone=classy_requests burst=40 nodelay;
    limit_req_status 429;

    # Verification documents must only use the authenticated Django endpoint.
    location ^~ /media/files/ { return 404; }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $classy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
