server {
    listen 127.0.0.1:8181;
    server_name localhost;
    include /etc/nginx/snippets/classy-web-locations.conf;
}
server {
    listen 80;
    server_name classystudy.com www.classystudy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classy-web/acme;
    }
    location / { return 301 https://classystudy.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name classystudy.com;
    ssl_certificate /etc/letsencrypt/live/classystudy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classystudy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/classy-web-locations.conf;
}
server {
    listen 443 ssl;
    server_name www.classystudy.com;
    ssl_certificate /etc/letsencrypt/live/classystudy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classystudy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://classystudy.com$request_uri;
}
