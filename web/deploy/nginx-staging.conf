# Until Gabia DNS points to this EC2 and the apex certificate is issued,
# only the loopback listener serves the application. No plaintext login.
server {
    listen 127.0.0.1:8181;
    server_name classystudy.com www.classystudy.com localhost;
    include /etc/nginx/snippets/classy-web-locations.conf;
}
server {
    listen 80;
    server_name classystudy.com www.classystudy.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classy-web/acme;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "CLASSY web deployment: HTTPS configuration in progress. Please try again shortly.\n";
    }
}
