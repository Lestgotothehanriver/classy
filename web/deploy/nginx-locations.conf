# Shared by the loopback verification server and public HTTPS server.
root /var/www/classy-web/current;
index index.html;
server_tokens off;
client_max_body_size 1g;
client_body_timeout 300s;
access_log /var/log/nginx/classy-web-access.log classy_no_query;
error_log /var/log/nginx/classy-web-error.log;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

location ^~ /api/ {
    # A trailing slash strips /api/. Django remains unchanged.
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host api.classystudy.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    limit_req zone=classy_requests burst=40 nodelay;
    limit_req_status 429;
}

# Existing app webviews use both trailing-slash and non-trailing-slash URLs.
location ~ ^/(privacy|service-terms)/?$ {
    try_files /$1.html =404;
}
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
}
location ~* \.(woff2|svg|png|webp)$ {
    try_files $uri =404;
    expires 1d;
}
location / {
    try_files $uri $uri.html /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
