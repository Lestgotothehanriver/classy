{% extends "admin/base_site.html" %}
{% block content %}
<form method="post">{% csrf_token %}
  <p>선택한 <strong>{{ queryset.count }}</strong>건의 학력 인증을 반려합니다. 반려 사유를 입력하세요. (PENDING 상태만 반려됩니다)</p>
  <p>
    <textarea name="reason" rows="4" cols="70" required placeholder="반려 사유"></textarea>
  </p>
  {% for obj in queryset %}
    <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="reject_selected">
  <input type="hidden" name="apply_reject" value="1">
  <div style="margin-top:1em;">
    <input type="submit" value="반려 실행" class="default">
    <a href="{% url 'admin:pending_pendinginstructor_changelist' %}" class="button" style="margin-left:8px;">취소</a>
  </div>
</form>
{% endblock %}
